<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rozdělovník LKMT – GitHub recovery probe</title><style>body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f4f6f8;color:#17202a}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}h1{font-size:22px}.warn{background:#fff3cd;border:1px solid #ffe69c;padding:12px;border-radius:8px;margin:12px 0}.ok{background:#e8f5e9;border:1px solid #a5d6a7;padding:12px;border-radius:8px;margin:12px 0}textarea{width:100%;height:68vh;box-sizing:border-box;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;overflow:auto}.bar{display:flex;gap:8px;margin:10px 0}button{padding:9px 14px;font-weight:600;cursor:pointer}</style></head><body><div class="wrap"><h1>Rozdělovník LKMT – bezpečná diagnostika GitHub localStorage</h1><div class="warn"><b>Pouze čtení.</b> Tento soubor nenačítá aplikaci ani Supabase a nic do localStorage nezapisuje. Nahraj ho do stejného GitHub Pages repozitáře vedle index.html pod tímto názvem a otevři jeho GitHub Pages adresu. <b>Nenahrazuj jím index.html.</b></div><div id="origin" class="ok"></div><div class="bar"><button id="run">Načíst diagnostiku</button><button id="copy">Kopírovat vše</button></div><textarea id="out" readonly></textarea></div><script>
(function(){
 const out=document.getElementById('out');
 document.getElementById('origin').textContent='Origin: '+location.origin+' | protokol: '+location.protocol;
 function parse(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
 function workerNameMap(){const a=parse('rozdelovnik_workers_2026')||parse('rozdelovnik_workers')||[];const m={};if(Array.isArray(a))a.forEach(w=>m[String(w.id)]=w.name||String(w.id));return m}
 function fmtObjEntries(obj,filter){return Object.entries(obj||{}).filter(([k,v])=>(!filter||filter(k,v))).sort((a,b)=>a[0].localeCompare(b[0]));}
 function run(){
  const L=[]; L.push('GITHUB RECOVERY PROBE – 2026');L.push('Pouze čtení. Nic neukládá ani nemaže.');L.push('Origin: '+location.origin+' | protokol: '+location.protocol);L.push('Čas kontroly: '+new Date().toLocaleString('cs-CZ'));L.push('');
  const keys=[];for(let i=0;i<localStorage.length;i++)keys.push(localStorage.key(i));keys.sort();
  L.push('=== RELEVANTNÍ LOCALSTORAGE KLÍČE ===');keys.filter(k=>/rozdelovnik|schedule|overtime|stat/i.test(k)).forEach(k=>{const raw=localStorage.getItem(k)||'';let info=raw.length+' znaků';try{const v=JSON.parse(raw);if(Array.isArray(v))info+=' | pole '+v.length;else if(v&&typeof v==='object')info+=' | objekt '+Object.keys(v).length+' klíčů'}catch(e){}L.push(k+' | '+info)});L.push('');
  const sched=parse('rozdelovnik_schedule')||{};const se=fmtObjEntries(sched,(k,v)=>String(k).startsWith('2026-'));
  L.push('=== SCHEDULE 2026 ===');L.push('Celkem: '+se.length+' buněk');['2026-05','2026-06','2026-07','2026-08','2026-09'].forEach(p=>L.push(p+' | '+se.filter(([k])=>k.startsWith(p)).length));L.push('');
  L.push('=== DETAIL ČERVEN + ČERVENEC 2026 ===');const wm=workerNameMap();const jj=se.filter(([k])=>k.startsWith('2026-06')||k.startsWith('2026-07'));const byWorker={};jj.forEach(([k,v])=>{let wid='?';let date=k;const parts=k.split('|');if(parts.length>=2){date=parts[0];wid=parts.slice(1).join('|')}else{const m=k.match(/^(2026-\d\d-\d\d)[_:](.+)$/);if(m){date=m[1];wid=m[2]}};(byWorker[wid]||(byWorker[wid]=[])).push([date,v])});Object.keys(byWorker).sort((a,b)=>(wm[a]||a).localeCompare(wm[b]||b,'cs')).forEach(w=>L.push((wm[w]||w)+' ['+w+'] | '+byWorker[w].map(x=>x[0]+'='+x[1]).join(', ')));if(!jj.length)L.push('Žádné záznamy.');L.push('');
  const ot=parse('rozdelovnik_overtime')||{};const oe=fmtObjEntries(ot,(k,v)=>Number(v)!==0);
  L.push('=== PŘESČASY – rozdelovnik_overtime ===');L.push('Nenulových: '+oe.length);oe.forEach(([k,v])=>L.push(k+' = '+v));L.push('');
  ['rozdelovnik_manual_statistics','rozdelovnik_manual_statistics_2026'].forEach(k=>{const o=parse(k);L.push('=== '+k+' ===');if(!o){L.push('nenalezeno');L.push('');return}L.push(JSON.stringify(o,null,2));L.push('')});
  L.push('=== POROVNÁNÍ S POSLEDNÍM STAVEM, KTERÝ JSME NAMĚŘILI ===');L.push('Referenční současný stav: schedule 2026 = 1498; 2026-05=179; 2026-06=158; 2026-07=75; 2026-08=156; 2026-09=157.');L.push('Pokud jsou zde vyšší počty nebo jiné položky v červnu/červenci, máme kandidáty k obnově.');
  out.value=L.join('\n');
 }
 document.getElementById('run').onclick=run;document.getElementById('copy').onclick=async()=>{if(!out.value)run();try{await navigator.clipboard.writeText(out.value);document.getElementById('copy').textContent='Zkopírováno';}catch(e){out.focus();out.select();document.execCommand('copy')}};run();
})();
</script></body></html>
